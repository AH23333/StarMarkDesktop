<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StarMark Boards</title>
<!-- 第一道 CSP 只能由页自己带：虚站映射供的那一发压根进不了 WebResourceRequested（片69 现读 allowed=0，宿主没那一发可加头）。
     只管这四维＝片70 六臂里唯一与基线逐颗同形的一颗；资源那一族⛔ 取（一挂上页面反多发 230 颗外站字体请求）。 -->
<meta http-equiv="Content-Security-Policy" content="frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="index.css">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  /* asset 全局必须在 bundle 之前落（片13 现读：设了它字体/locales 才不打外网）。 */
  window.EXCALIDRAW_ASSET_PATH = "/";
</script>
<script src="excalidraw.min.js"></script>
<script src="board-bridge.js"></script>
</body>
</html>
